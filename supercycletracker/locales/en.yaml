send_failed: "I could not send you what I had. Can you ask me again?"
ai_busy: "I can't answer right now: I have no capacity left for {wait}. I'll answer everything then, with no need to repeat anything. Meanwhile you can note it with the buttons."
busy_minutes: "about {n} minutes"
busy_hours: "about {n} hours"
no_ai: "Without the assistant I cannot read written messages. You can note it with the buttons:"
