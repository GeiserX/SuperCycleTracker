later_failed: "I could not finish what I was doing. Ask me again later."
pain_high: "A pain of {n} is a lot. If it does not ease with what you usually take, or it happens often, it is worth mentioning to your doctor."
only_her: "This is only for {name}."
toast_saved: "Noted: {what}"
toast_old: "That card is too old, so I saved nothing."
toast_error: "Something went wrong, so I saved nothing."
undo_done: "Undone: {what}."
undo_none: "Nothing to undo."
invalid_settings: "I could not apply that change, so I left everything as it was. The hour goes from 05:00 to 23:59 (for example, /hora 21:30) and the last day I ask, from 3 to 14."
settings_done: "Changed: {what}."
settings_ask_at: "I ask you at {time}"
