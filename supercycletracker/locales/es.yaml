# --- commands ------------------------------------------------------------------------------
anotar_usage: "Uso: /anotar &lt;cuándo&gt; &lt;cuánto&gt; [dolor 0-10] [síntomas…]. Ejemplo: /anotar ayer mucho 6 calambres"
anotar_saved: "Anotado sin el asistente: {summary}. Si no es así, /deshacer."
new_conversation: "Empiezo una conversación nueva. Lo apuntado sigue igual."
test_mark: "(prueba)"
menu:
  hoy: "La pregunta de hoy, o cuéntame algo"
  resumen: "Tu ciclo en pocas líneas"
  anotar: "Anotar un día sin el asistente"
  hora: "Cambiar la hora a la que pregunto"
  deshacer: "Deshacer lo último que anoté"
  recordatorios: "Los recordatorios pendientes, para cancelarlos"
  ayuda: "Lo que entiendo"
help: |-
  Esto es lo que entiendo:
  /hoy: la pregunta de hoy; con texto detrás, me lo cuentas
  /resumen: tu ciclo en pocas líneas
  /anotar ayer mucho 6 calambres: anotar un día sin el asistente
  /hora 21:30: cambiar la hora a la que pregunto
  /deshacer: deshacer lo último que anoté
  /recordatorios: los recordatorios pendientes, para cancelarlos
  /ayuda: esta lista
  También puedes responder a cualquiera de mis mensajes.
help_admin: |-
  Para administradores:
  /estado: cómo va el bot
  /nuevo: empezar una conversación nueva con el asistente
  /presentacion: publicar la presentación
intro: |-
  Hola. Soy el bot que lleva la cuenta del ciclo de {name} en este grupo.
  Los días en que la regla puede llegarle, le pregunto por la noche con botones: basta con un toque. Mientras dura, pregunto cada día cómo va, y también por el día de antes.
  Puede responder a cualquiera de mis mensajes con sus palabras o con una nota de voz, y lo anoto.
  Puede preguntarme dudas sobre su ciclo o su salud; contesto teniendo en cuenta su propio historial y busco en fuentes fiables.
  Si quiere cambiar algo (la hora a la que pregunto, cómo funciono), basta con pedírmelo.
  Cuando puedo hacer algo por ella (un recordatorio, apuntar la previsión del ciclo en su calendario), se lo ofrezco con botones; si no responde, no hago nada. /recordatorios enseña los que hay y deja cancelarlos.
  Lo que anoto se guarda en un repositorio privado de esta casa. Para entender lo que escribe y contestar sus dudas, un asistente de IA lee sus mensajes y su historial.
  /ayuda tiene la lista de lo que entiendo.

