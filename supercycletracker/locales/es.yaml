# Spanish strings (keys from en.yaml). Every «?» goes with its «¿» and every «!» with its «¡».

# --- the scheduled ask and the card steps ------------------------------------------------
ask_waiting: "{m}, por tus últimos ciclos la regla podría llegarte estos días. ¿Te ha bajado ya?"
ask_late: "{m}, ¿alguna novedad? Cuando te baje, me lo dices con un toque."
